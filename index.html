let state = loadState();

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && Array.isArray(parsed.accounts) && Array.isArray(parsed.clients) && Array.isArray(parsed.elevators)) {
        const seed = createSeedState();
        if (!Array.isArray(parsed.invoices)) parsed.invoices = seed.invoices;
        if (!Array.isArray(parsed.installRequests)) parsed.installRequests = seed.installRequests;
        return parsed;
      }
    }
  } catch (e) {
    console.warn('Gagal membaca localStorage Enterprise, memuat seed state:', e);
  }
  const seed = createSeedState();
  localStorage.setItem(STORAGE_KEY, JSON.stringify(seed));
  return seed;
}

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (e) {
    console.error('Gagal menyimpan state:', e);
  }
}

function resetDemoData() {
  state = createSeedState();
  saveState();
  chatbotMessages = [];
  chatbotInitializedForUser = null;
  activeLoginRoleTab = 'all';
  adminCityFilter = 'all';
  pjk3CityFilter = 'all';
  pjk3StatusFilter = 'all';
  closeModal();
  if (document.getElementById('app-view').classList.contains('hidden')) {
    renderLoginView();
  } else {
    logout();
  }
  showToast('Data demo Enterprise Suite berhasil direset ke kondisi awal.', 'success');
}

function escapeHtml(str) {
  if (str === null || str === undefined) return '';
  return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
}

function formatRp(num) {
  return 'Rp ' + Math.round(num).toLocaleString('id-ID');
}

function formatRpShort(num) {
  const n = Math.round(num);
  if (n >= 1000000000) return 'Rp ' + (n / 1000000000).toFixed(2).replace('.', ',') + ' M';
  if (n >= 1000000) return 'Rp ' + (n / 1000000).toFixed(1).replace('.', ',') + ' Jt';
  return formatRp(n);
}

function formatTimeAgo(iso) {
  if (!iso) return '-';
  const diffSec = Math.max(1, Math.floor((Date.now() - new Date(iso).getTime()) / 1000));
  if (diffSec < 60) return 'Baru saja';
  const diffMin = Math.floor(diffSec / 60);
  if (diffMin < 60) return diffMin + ' mnt lalu';
  const diffHour = Math.floor(diffMin / 60);
  if (diffHour < 24) return diffHour + ' jam lalu';
  return Math.floor(diffHour / 24) + ' hari lalu';
}

function formatDateTime(iso) {
  if (!iso) return '-';
  return new Date(iso).toLocaleString('id-ID', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
}

function showToast(message, type = 'info') {
  const container = document.getElementById('toast-container');
  const id = 'toast_' + Date.now() + '_' + Math.floor(Math.random() * 1000);
  const styles = {
    success: 'bg-emerald-900 text-white border-emerald-700',
    error: 'bg-rose-900 text-white border-rose-700',
    warning: 'bg-amber-900 text-white border-amber-700',
    info: 'bg-slate-900 text-white border-slate-700'
  };
  const icons = { success: 'check-circle-2', error: 'alert-octagon', warning: 'alert-triangle', info: 'info' };
  const el = document.createElement('div');
  el.id = id;
  el.className = `pointer-events-auto flex items-start gap-2.5 px-4 py-3 rounded-xl border shadow-xl text-xs font-medium animate-slide-up ${styles[type] || styles.info}`;
  el.innerHTML = `<i data-lucide="${icons[type] || 'info'}" class="w-4 h-4 shrink-0 mt-0.5"></i><span class="flex-1 leading-relaxed">${escapeHtml(message)}</span>`;
  container.appendChild(el);
  if (window.lucide) lucide.createIcons({ root: el });
  setTimeout(() => { const t = document.getElementById(id); if (t) t.remove(); }, 3800);
}

function openModal(htmlContent, maxWidthClass = 'max-w-lg') {
  const root = document.getElementById('modal-root');
  root.innerHTML = `<div class="w-full ${maxWidthClass} bg-white rounded-2xl shadow-2xl border border-slate-200 overflow-hidden animate-slide-up my-auto" onclick="event.stopPropagation()">${htmlContent}</div>`;
  root.classList.remove('hidden');
  root.classList.add('flex');
  root.onclick = (e) => { if (e.target === root) closeModal(); };
  if (window.lucide) lucide.createIcons({ root });
}

function closeModal() {
  const root = document.getElementById('modal-root');
  root.classList.add('hidden');
  root.classList.remove('flex');
  root.innerHTML = '';
  destroyChart('modalRoomTempChart');
}

function destroyChart(id) {
  if (chartInstances[id]) { chartInstances[id].destroy(); delete chartInstances[id]; }
}

function destroyAllCharts() {
  Object.keys(chartInstances).forEach((k) => { if (chartInstances[k]) chartInstances[k].destroy(); });
  chartInstances = {};
}

function renderChart(canvasId, config) {
  destroyChart(canvasId);
  const canvas = document.getElementById(canvasId);
  if (!canvas || !window.Chart) return null;
  chartInstances[canvasId] = new Chart(canvas.getContext('2d'), config);
  return chartInstances[canvasId];
}

function copyToClipboard(text, label = 'Teks') {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => showToast(`${label} berhasil disalin ke clipboard.`, 'success')).catch(() => fallbackCopy(text, label));
  } else {
    fallbackCopy(text, label);
  }
}

function fallbackCopy(text, label) {
  const ta = document.createElement('textarea');
  ta.value = text;
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  ta.remove();
  showToast(`${label} berhasil disalin.`, 'success');
}

  if (city === 'Malang') return '<span class="px-2 py-0.5 rounded-full text-[11px] font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200">Malang</span>';
  if (city === 'Jawa Timur') return '<span class="px-2 py-0.5 rounded-full text-[11px] font-semibold bg-indigo-50 text-indigo-700 border border-indigo-200">Jawa Timur</span>';
  return `<span class="px-2 py-0.5 rounded-full text-[11px] font-semibold bg-slate-100 text-slate-700 border border-slate-200">${escapeHtml(city)}</span>`;

  return `<span class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-[11px] font-semibold border ${map[status] || map['Off-Duty']}"><span class="w-1.5 h-1.5 rounded-full ${dot[status] || 'bg-slate-400'}"></span>${escapeHtml(status)}</span>`;

function getK3Badge(k3Status, expiryDate) {
  const daysLeft = Math.ceil((new Date(expiryDate).getTime() - Date.now()) / 86400000);
  if (k3Status === 'Kedaluwarsa') {
    return `<span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-rose-100 text-rose-800 border border-rose-300">Kedaluwarsa / Expired</span>`;
  }
  if (k3Status === 'Segera Habis') {
    return `<span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-amber-100 text-amber-800 border border-amber-300">Segera Habis / H-${Math.max(1, daysLeft)}</span>`;
  }
  return `<span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-emerald-100 text-emerald-800 border border-emerald-300">Layak K3 / Aktif</span>`;

function getLiftIotBadge(iotStatus) {

  if (iotStatus === 'Sedang Riksa Uji') return `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-bold bg-indigo-100 text-indigo-700 border border-indigo-200">Sedang Riksa Uji</span>`;
  return `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-bold bg-emerald-50 text-emerald-700 border border-emerald-200">Normal</span>`;

    officeOpd: { autoCutoff: true, setpoint: 23.0 },
    publicWbp: { setpointGuard: true, minSetpoint: 23.5, wbpLimiter: true }
  };

  const baselineKwhMonth = building.baselineMonthlyKwh || Math.round(building.kwhMonthly / 0.75);
  const baselineEnergyRpMonth = baselineKwhMonth * ELECTRIC_TARIFF_RP;
  const baselineMaintRpMonth = building.baselineMonthlyMaintRp || 28000000;
  const baselineTotalOverheadMonth = baselineEnergyRpMonth + baselineMaintRpMonth;

  const autoCutoffPct = z.officeOpd.autoCutoff ? (0.042 + 0.021 * sim.cutHoursPerDay) : 0;
  const minSpBonus = Math.max(0, ((z.publicWbp.minSetpoint || 23.5) - 23.5) * 0.015);
  const setpointGuardPct = z.publicWbp.setpointGuard ? (0.032 + 0.031 * sim.setpointBoostC + minSpBonus) : 0;
  const wbpPct = (z.publicWbp.wbpLimiter && sim.wbpMode) ? 0.068 : 0;

  const totalEnergyReductionRatio = Math.min(0.36, autoCutoffPct + setpointGuardPct + wbpPct);
  const kwhReductionRatio = Math.min(0.32, autoCutoffPct + setpointGuardPct + wbpPct * 0.72);

  const savedKwhMonth = Math.round(baselineKwhMonth * kwhReductionRatio);
  const actualKwhMonth = Math.max(0, baselineKwhMonth - savedKwhMonth);
  const energySavedRpMonth = Math.round(baselineEnergyRpMonth * totalEnergyReductionRatio);

  const preventiveFactor = 0.13 + (z.officeOpd.autoCutoff ? 0.04 : 0) + (z.publicWbp.setpointGuard ? 0.035 : 0) + (z.publicWbp.wbpLimiter ? 0.015 : 0);
  const avoidedBreakdownRpMonth = Math.round(baselineMaintRpMonth * preventiveFactor);
  const bundledContractRpMonth = Math.round(baselineMaintRpMonth * 0.115);

  const totalSavedRpMonth = energySavedRpMonth + avoidedBreakdownRpMonth + bundledContractRpMonth;
  const totalSavedRpYear = totalSavedRpMonth * 12;
  const overheadReductionPct = baselineTotalOverheadMonth > 0 ? Number(((totalSavedRpMonth / baselineTotalOverheadMonth) * 100).toFixed(1)) : 0;

  return {
    baselineKwhMonth,
    actualKwhMonth,
    savedKwhMonth,
    savedKwhYear: savedKwhMonth * 12,
    baselineEnergyRpMonth,
    baselineMaintRpMonth,
    baselineTotalOverheadMonth,
    energySavedRpMonth,
    avoidedBreakdownRpMonth,
    bundledContractRpMonth,
    totalSavedRpMonth,
    totalSavedRpYear,
    postBmsOverheadMonth: Math.max(0, baselineTotalOverheadMonth - totalSavedRpMonth),
    overheadReductionPct,
    kwhReductionPct: Number((kwhReductionRatio * 100).toFixed(1))
  };
}

function computeScopeROI(buildings) {
  let baselineKwhMonth = 0, actualKwhMonth = 0, savedKwhMonth = 0;
  let baselineEnergyRpMonth = 0, baselineMaintRpMonth = 0, baselineTotalOverheadMonth = 0;
  let energySavedRpMonth = 0, avoidedBreakdownRpMonth = 0, bundledContractRpMonth = 0;

  buildings.forEach((b) => {
    const s = computeBuildingSavings(b);
    baselineKwhMonth += s.baselineKwhMonth;
    actualKwhMonth += s.actualKwhMonth;
    savedKwhMonth += s.savedKwhMonth;
    baselineEnergyRpMonth += s.baselineEnergyRpMonth;
    baselineMaintRpMonth += s.baselineMaintRpMonth;
    baselineTotalOverheadMonth += s.baselineTotalOverheadMonth;
    energySavedRpMonth += s.energySavedRpMonth;
    avoidedBreakdownRpMonth += s.avoidedBreakdownRpMonth;
    bundledContractRpMonth += s.bundledContractRpMonth;
  });

  const totalSavedRpMonth = energySavedRpMonth + avoidedBreakdownRpMonth + bundledContractRpMonth;
  const totalSavedRpYear = totalSavedRpMonth * 12;
  const overheadReductionPct = baselineTotalOverheadMonth > 0 ? Number(((totalSavedRpMonth / baselineTotalOverheadMonth) * 100).toFixed(1)) : 0;
  const estCapexRp = Math.max(1, buildings.length) * 48000000;
  const paybackMonths = totalSavedRpMonth > 0 ? Number((estCapexRp / totalSavedRpMonth).toFixed(1)) : 0;

  return {
    buildingCount: buildings.length,
    baselineKwhMonth,
    actualKwhMonth,
    savedKwhMonth,
    savedKwhYear: savedKwhMonth * 12,
    baselineEnergyRpMonth,
    baselineMaintRpMonth,
    baselineTotalOverheadMonth,
    energySavedRpMonth,
    avoidedBreakdownRpMonth,
    bundledContractRpMonth,
    totalSavedRpMonth,
    totalSavedRpYear,
    postBmsOverheadMonth: Math.max(0, baselineTotalOverheadMonth - totalSavedRpMonth),
    overheadReductionPct,
    paybackMonths
  };
}

function computeStarkesIndex(client) {
  if (!client || !client.isHospital) return null;
  const totalBld = client.buildings.length;
  const onlineGw = client.buildings.filter((b) => b.gatewayStatus === 'Online').length;
  const gwScore = Math.round((onlineGw / Math.max(1, totalBld)) * 15);

  const critRooms = [];
  client.buildings.forEach((b) => b.rooms.forEach((r) => { if (r.zoneType === 'critical24') critRooms.push(r); }));
  const critOk = critRooms.filter((r) => r.status !== 'Error').length;
  const hvacScore = Math.round((critOk / Math.max(1, critRooms.length)) * 35);

  const lifts = state.elevators.filter((e) => e.clientId === client.id);
  let liftPoints = 0;
  lifts.forEach((l) => {
    if (l.k3Status === 'Layak K3') liftPoints += 1;
    else if (l.k3Status === 'Segera Habis') liftPoints += 0.65;
    else liftPoints += 0.15;
  });
  const liftScore = Math.round((liftPoints / Math.max(1, lifts.length)) * 35);

  const ardReady = lifts.filter((l) => l.iotStatus === 'Normal' && String(l.ardStatus).includes('Siap')).length;
  const ardScore = Math.round((ardReady / Math.max(1, lifts.length)) * 15);

  const totalScore = Math.min(100, gwScore + hvacScore + liftScore + ardScore);
  const label = totalScore >= 92 ? 'Paripurna (Siap Akreditasi)' : totalScore >= 80 ? 'Madya (Layak Bersyarat)' : 'Perlu Tindakan Segera';
  return {
    totalScore, gwScore, hvacScore, liftScore, ardScore, label,
    critErrCount: critRooms.length - critOk,
    expiredLiftCount: lifts.filter((l) => l.k3Status === 'Kedaluwarsa').length,
    soonLiftCount: lifts.filter((l) => l.k3Status === 'Segera Habis').length
  };
}

  e.preventDefault();

  const password = document.getElementById('login-password').value;
  if (!username || !password) {
    showLoginError('Username dan password wajib diisi.');

  }

  showToast(`Kredensial ${acc.name} diisi ke form login.`, 'info');

function loginAs(username) {
  const acc = state.accounts.find((a) => a.username === username);
  if (!acc) return;
  state.currentUser = acc.username;
  addAuditLog(acc.username, acc.role, acc.city, `Login ke dashboard Nexus Enterprise sebagai ${acc.name} (${acc.role}).`);
  saveState();

  const defaultTabs = { superadmin: 'overview', admin: 'executive', client: 'overview', technician: 'workorders', pjk3: 'compliance' };

  clientSelectedBuildingId = '';
  clientRoomStatusFilter = 'all';

  showToast(`Selamat datang, ${acc.name}!`, 'success');

  const acc = getCurrentAccount();
  if (acc) addAuditLog(acc.username, acc.role, acc.city, 'Logout dari sesi dashboard.');
  state.currentUser = null;
  saveState();
  destroyAllCharts();

function submitSimulateError(e) {
  e.preventDefault();
  const assetType = document.getElementById('sim-asset-select').value;
  const targetClientId = document.getElementById('sim-client-select').value;
  const woNum = 'WO-2026-' + String(state.tickets.length + 1).padStart(3, '0');
  const nowIso = new Date().toISOString();
  const actorAcc = getCurrentAccount();

  if (assetType === 'Lift') {
    const candidates = state.elevators.filter((el) => (targetClientId === 'random' || el.clientId === targetClientId) && el.iotStatus === 'Normal');
    if (candidates.length === 0) { showToast('Semua lift pada target sudah berstatus Fault / Riksa Uji.', 'warning'); return; }
    const elv = candidates[Math.floor(Math.random() * candidates.length)];
    const liftRules = state.errorDictionary.filter((d) => d.assetType === 'Lift' && d.brand === elv.brand);
    const allLiftRules = state.errorDictionary.filter((d) => d.assetType === 'Lift');
    const rule = liftRules.length > 0 ? liftRules[0] : allLiftRules[Math.floor(Math.random() * allLiftRules.length)];

    elv.iotStatus = 'Fault / Alarm';
    elv.errorCode = rule.code;
    state.tickets.unshift({
      id: woNum, assetType: 'Lift', clientId: elv.clientId, clientName: elv.clientName, clientUsername: elv.clientUsername,
      city: elv.city, buildingId: elv.buildingId, buildingName: elv.buildingName, roomId: elv.id,
      roomName: elv.name, floor: elv.currentFloor, unitId: elv.id, brand: elv.brand,
      errorCode: rule.code, status: 'Menunggu Penugasan', assignedTo: null, techAccepted: false, checklistDone: {},
      createdAt: nowIso, updatedAt: nowIso, completedAt: null, repairNotes: '', partsUsed: ''
    });

    pushNotification(elv.clientUsername, `Alert IoT Lift ${elv.name} (${elv.buildingName})`, `${rule.humanTranslation} Tiket ${woNum} otomatis dikirim.`, 'error', 'elevators');
    pushNotification('admin_eka', `Fault Lift [${elv.city}]: ${elv.name} (${rule.code})`, `${elv.clientName} - ${elv.buildingName} mengalami ${rule.factoryMeaning}.`, 'error', 'errors');
    pushNotification('superadmin', `Alert Telemetry Lift ${elv.id}`, `Kode error ${rule.code} terdeteksi di ${elv.clientName}.`, 'warning', 'overview');
    addAuditLog(actorAcc ? actorAcc.username : 'system', actorAcc ? actorAcc.role : 'System', elv.city, `Simulasi error Lift ${woNum}: ${elv.name} [${elv.brand} ${rule.code}].`);
    saveState(); closeModal(); renderDashboard();
    showToast(`Simulasi Error Lift ${woNum} (${rule.code}) berhasil dipicu!`, 'error');
    return;
  }

  let candidates = [];
  state.clients.forEach((c) => {
    if (targetClientId !== 'random' && c.id !== targetClientId) return;
    c.buildings.forEach((b) => b.rooms.forEach((r) => { if (r.status !== 'Error') candidates.push({ client: c, building: b, room: r }); }));
  });
  if (candidates.length === 0) { showToast('Semua ruangan pada target yang dipilih sudah berstatus Error.', 'warning'); return; }

  const pick = candidates[Math.floor(Math.random() * candidates.length)];
  const brandRules = state.errorDictionary.filter((d) => d.assetType !== 'Lift' && d.brand === pick.building.brand);
  const rule = brandRules.length > 0 ? brandRules[Math.floor(Math.random() * brandRules.length)] : state.errorDictionary[0];

  pick.room.status = 'Error';
  pick.room.errorCode = rule.code;
  pick.room.mode = 'Cool';
  pick.room.temp = Number((pick.room.targetTemp + 5.8 + Math.random() * 2.2).toFixed(1));
  pick.room.tempHistory6h = [
    pick.room.targetTemp, Number((pick.room.targetTemp + 0.8).toFixed(1)),
    Number((pick.room.targetTemp + 2.1).toFixed(1)), Number((pick.room.targetTemp + 3.6).toFixed(1)),
    Number((pick.room.targetTemp + 4.9).toFixed(1)), pick.room.temp
  ];

  state.tickets.unshift({
    id: woNum, assetType: 'AC', clientId: pick.client.id, clientName: pick.client.name, clientUsername: pick.client.ownerUsername,
    city: pick.client.city, buildingId: pick.building.id, buildingName: pick.building.name, roomId: pick.room.id,
    roomName: pick.room.name, floor: pick.room.floor, unitId: pick.room.unitId, brand: pick.building.brand,
    errorCode: rule.code, status: 'Menunggu Penugasan', assignedTo: null, techAccepted: false, checklistDone: {},
    createdAt: nowIso, updatedAt: nowIso, completedAt: null, repairNotes: '', partsUsed: ''
  });

  pushNotification(pick.client.ownerUsername, `Gangguan Pendinginan ${pick.room.name} (${pick.building.name})`, `${rule.humanTranslation} Tiket ${woNum} otomatis dikirim.`, 'error', 'tickets');
  pushNotification('admin_eka', `Error Baru [${pick.client.city}]: ${pick.client.name} (${rule.code})`, `${pick.building.name} - ${pick.room.name} mengalami ${rule.factoryMeaning}.`, 'error', 'errors');
  pushNotification('superadmin', `Alert Gateway ${pick.building.gatewayId}`, `Kode error ${rule.code} terdeteksi di ${pick.client.name} (${pick.client.city}).`, 'warning', 'overview');
  addAuditLog(actorAcc ? actorAcc.username : 'system', actorAcc ? actorAcc.role : 'System', pick.client.city, `Simulasi error baru ${woNum}: ${pick.client.name} (${pick.building.name} - ${pick.room.name}) [${pick.building.brand} ${rule.code}].`);
  saveState(); closeModal(); renderDashboard();
  showToast(`Simulasi Error ${woNum} (${rule.code}) berhasil dipicu di ${pick.client.name}!`, 'error');
}

function selectSchedulingBuilding(bldId) {
  schedulingSelectedBuildingId = bldId;
  renderDashboard();

function toggleBuildingZoneSetting(buildingId, zoneKey, fieldKey) {
  let targetBld = null, targetClient = null;
  state.clients.forEach((c) => c.buildings.forEach((b) => { if (b.id === buildingId) { targetBld = b; targetClient = c; } }));
  if (!targetBld || !targetBld.zones || !targetBld.zones[zoneKey]) return;
  targetBld.zones[zoneKey][fieldKey] = !targetBld.zones[zoneKey][fieldKey];
  const acc = getCurrentAccount();
  addAuditLog(acc ? acc.username : 'system', acc ? acc.role : 'user', targetClient.city, `Mengubah kontrol jadwal ${targetBld.name} (${zoneKey}.${fieldKey} = ${targetBld.zones[zoneKey][fieldKey]}).`);
  saveState();
  renderDashboard();
  showToast(`Jadwal IoT ${targetBld.name} diperbarui & penghematan dihitung ulang.`, 'success');
}

function updateBuildingZoneScheduleField(buildingId, zoneKey, fieldKey, value) {
  let targetBld = null;
  state.clients.forEach((c) => c.buildings.forEach((b) => { if (b.id === buildingId) targetBld = b; }));
  if (!targetBld || !targetBld.zones || !targetBld.zones[zoneKey]) return;
  targetBld.zones[zoneKey][fieldKey] = fieldKey === 'minSetpoint' || fieldKey === 'setpoint' ? Number(value) : value;
  saveState();
  renderDashboard();
  showToast(`Parameter jadwal ${targetBld.name} disimpan.`, 'info');
}

function updateRoiSimParam(key, val) {
  if (!state.roiSim) state.roiSim = { setpointBoostC: 2.0, cutHoursPerDay: 3.0, wbpMode: true };
  if (key === 'wbpMode') state.roiSim.wbpMode = !state.roiSim.wbpMode;
  else state.roiSim[key] = Number(val);
  saveState();
  renderDashboard();
}

function applyAllSmartZones(buildings, enableAll) {
  buildings.forEach((b) => {
    b.zones.officeOpd.autoCutoff = enableAll;
    b.zones.publicWbp.setpointGuard = enableAll;
    b.zones.publicWbp.wbpLimiter = enableAll;
  });
  const acc = getCurrentAccount();
  addAuditLog(acc ? acc.username : 'system', acc ? acc.role : 'user', acc ? acc.city : 'Global', `${enableAll ? 'Mengaktifkan' : 'Menonaktifkan'} seluruh mode hemat Smart Scheduling IoT pada ${buildings.length} gedung.`);
  saveState();
  renderDashboard();
  showToast(enableAll ? 'Seluruh fitur Smart Scheduling IoT diaktifkan!' : 'Mode Smart Scheduling IoT dinonaktifkan untuk perbandingan baseline.', enableAll ? 'success' : 'warning');
}

function renderSmartSchedulingView(container, buildings, scopeTitle, isAdminScope) {
  if (!buildings.some((b) => b.id === schedulingSelectedBuildingId)) {
    schedulingSelectedBuildingId = buildings[0].id;

  });

  renderChart('roiBeforeAfterChart', {
    type: 'bar',
    data: {

        label: 'Overhead Bulanan (Juta Rp)',

      }]

function submitRequestRiksa(e, elevatorId) {
  e.preventDefault();
  const elv = state.elevators.find((x) => x.id === elevatorId);
  if (!elv) return;
  const reqDate = document.getElementById('riksa-req-date').value;
  const notes = document.getElementById('riksa-req-notes').value.trim();
  const acc = getCurrentAccount();

  elv.riksaRequestStatus = 'Diajukan';
  elv.riksaRequestedAt = new Date().toISOString();
  elv.riksaPreferredDate = reqDate;
  elv.riksaRequestNotes = notes;

  pushNotification('pjk3_jatim', `Permohonan Riksa Uji Baru: ${elv.name} (${elv.city})`, `${elv.clientName} - ${elv.buildingName} mengajukan Riksa Uji K3 (usulan ${reqDate}). Status saat ini: ${elv.k3Status}.`, 'warning', 'inspection');
  if (acc && acc.username !== 'admin_eka') {
    pushNotification('admin_eka', `Permohonan Riksa Uji PJK3: ${elv.id}`, `${elv.clientName} mengajukan tera/riksa uji K3 untuk ${elv.name}. Diteruskan ke Ir. Bambang Suryono (PJK3 Jatim).`, 'info', 'elevators');
  }
  if (acc && acc.username !== elv.clientUsername) {
    pushNotification(elv.clientUsername, `Permohonan Riksa Uji ${elv.name} Terkirim`, `Admin Partner telah mengajukan Riksa Uji K3 ke PJK3 Disnakertrans Jatim untuk ${elv.name}.`, 'info', 'elevators');
  }

  addAuditLog(acc ? acc.username : 'system', acc ? acc.role : 'user', elv.city, `Mengajukan Riksa Uji K3 PJK3 untuk ${elv.name} (${elv.id}, usulan ${reqDate}).`);
  saveState();
  closeModal();
  renderDashboard();
  showToast(`Permohonan Riksa Uji PJK3 untuk ${elv.name} terkirim ke @pjk3_jatim!`, 'success');
}

function togglePjk3CheckAll(checked) {
  document.querySelectorAll('.pjk3-check-item').forEach((cb) => { cb.checked = checked; });
  const warn = document.getElementById('pjk3-check-warning');
  if (warn) warn.classList.add('hidden');
}

function submitPjk3Certificate(e, elevatorId) {
  e.preventDefault();
  const checkboxes = Array.from(document.querySelectorAll('.pjk3-check-item'));
  const allChecked = checkboxes.length === 6 && checkboxes.every((cb) => cb.checked);
  if (!allChecked) {
    const warn = document.getElementById('pjk3-check-warning');
    if (warn) warn.classList.remove('hidden');
    showToast('Harap lengkapi seluruh 6 komponen checklist K3.', 'warning');
    return;
  }

  const elv = state.elevators.find((x) => x.id === elevatorId);
  if (!elv) return;
  const notes = document.getElementById('pjk3-inspector-notes').value.trim();
  const todayStr = new Date().toISOString().slice(0, 10);
  const nextYearStr = new Date(Date.now() + 365 * 86400000).toISOString().slice(0, 10);
  const newSuket = `566/${3100 + Math.floor(Math.random() * 899)}/PJK3-JTM/${new Date().getFullYear()}`;

  elv.k3Status = 'Layak K3';
  elv.iotStatus = 'Normal';
  elv.ardStatus = 'Siap (Baterai 100% Terkalibrasi)';
  elv.suketNumber = newSuket;
  elv.lastInspectionDate = todayStr;
  elv.expiryDate = nextYearStr;
  elv.riksaRequestStatus = 'Selesai (Terbit)';
  elv.lastChecklist = {
    inspector: 'Ir. Bambang Suryono (PJK3 Riksa Uji K3 Jatim)',
    license: 'SKP-PJK3/JTM/042/2026',
    issuedAt: new Date().toISOString(),
    notes,
    items: PJK3_CHECKLIST_ITEMS.map((i) => i.label)
  };

  pushNotification(elv.clientUsername, `E-Suket Layak K3 Terbit: ${elv.name}`, `Nomor ${newSuket} berlaku 365 hari s.d. ${nextYearStr}. Status lift kini Layak K3 / Aktif.`, 'success', 'elevators');
  pushNotification('admin_eka', `Suket K3 Digital Diterbitkan (${elv.id})`, `Ir. Bambang Suryono (PJK3 Jatim) menerbitkan Suket ${newSuket} untuk ${elv.clientName} (${elv.name}).`, 'success', 'elevators');
  pushNotification('superadmin', `Kepatuhan K3 Lift Diperbarui: ${elv.id}`, `${elv.clientName} (${elv.name}) kini Layak K3 hingga ${nextYearStr}.`, 'info', 'overview');

  addAuditLog('pjk3_jatim', 'pjk3', elv.city, `Menerbitkan E-Suket Layak K3 ${newSuket} (365 hari) untuk ${elv.name} (${elv.clientName}).`);
  saveState();
  closeModal();
  renderDashboard();
  showToast(`Suket Layak K3 ${newSuket} berhasil diterbitkan untuk ${elv.name}!`, 'success');
}

  addAuditLog('superadmin', 'superadmin', 'Global', `Melakukan Refresh Ping ke 11 Edge Gateway (${onlineCount}/11 merespons).`);
  saveState(); renderDashboard();
  showToast(`Ping selesai: ${onlineCount}/11 Edge Gateway Online.`, 'success');

function toggleGatewayStatus(clientId, buildingId) {
  const client = state.clients.find((c) => c.id === clientId);
  const bld = client && client.buildings.find((b) => b.id === buildingId);
  if (!bld) return;
  if (bld.gatewayStatus === 'Online') {
    bld.gatewayStatus = 'Offline'; bld.latencyMs = 0;
    addAuditLog('superadmin', 'superadmin', client.city, `Simulasi gateway ${bld.gatewayId} menjadi Offline.`);
    showToast(`${bld.gatewayId} disimulasikan Offline.`, 'warning');
  } else {
    bld.gatewayStatus = 'Online'; bld.latencyMs = 28 + Math.floor(Math.random() * 25);
    addAuditLog('superadmin', 'superadmin', client.city, `Gateway ${bld.gatewayId} kembali Online.`);

  }
  saveState(); renderDashboard();
}

function submitAddErrorRule(e) {
  e.preventDefault();
  const assetType = document.getElementById('rule-asset').value;
  const brand = document.getElementById('rule-brand').value;
  const code = document.getElementById('rule-code').value.trim().toUpperCase();
  const factoryMeaning = document.getElementById('rule-factory').value.trim();
  const humanTranslation = document.getElementById('rule-human').value.trim();
  const recommendedPart = document.getElementById('rule-part').value.trim();
  const estDuration = document.getElementById('rule-duration').value.trim();

  if (state.errorDictionary.some((d) => d.brand === brand && d.code === code)) {
    showToast(`Kode ${code} untuk ${brand} sudah ada.`, 'warning'); return;
  }
  state.errorDictionary.unshift({
    id: 'err_' + Date.now(), assetType, brand, code, factoryMeaning, humanTranslation, recommendedPart, estDuration, severity: 'Tinggi',
    checklist: [recommendedPart, 'Multimeter Digital', 'Tool Kit Standar']
  });
  addAuditLog('superadmin', 'superadmin', 'Global', `Menambahkan aturan kamus error ${assetType} ${brand} [${code}].`);
  saveState(); closeModal(); renderDashboard();
  showToast(`Aturan ${brand} [${code}] ditambahkan.`, 'success');
}

function deleteErrorRule(ruleId) {
  const idx = state.errorDictionary.findIndex((d) => d.id === ruleId);
  if (idx === -1) return;
  const removed = state.errorDictionary.splice(idx, 1)[0];
  addAuditLog('superadmin', 'superadmin', 'Global', `Menghapus aturan ${removed.brand} [${removed.code}].`);
  saveState(); renderDashboard();
  showToast(`Aturan ${removed.brand} [${removed.code}] dihapus.`, 'info');
}

function assignTechnicianFromSelect(ticketId) {
  const sel = document.getElementById('dispatch-select-' + ticketId);
  if (!sel || !sel.value) { showToast('Pilih teknisi sekota terlebih dahulu.', 'warning'); return; }
  assignTechnician(ticketId, sel.value);
}

function assignTechnician(ticketId, techUsername) {
  const t = state.tickets.find((x) => x.id === ticketId);
  const tech = state.accounts.find((a) => a.username === techUsername && a.role === 'technician');
  if (!t || !tech) return;
  if (tech.city !== t.city) { showToast(`Gagal: Teknisi ${tech.name} (${tech.city}) tidak sekota dengan ${t.clientName} (${t.city}).`, 'error'); return; }

  t.assignedTo = tech.username;
  t.status = 'Teknisi Ditugaskan';
  t.techAccepted = false;
  t.updatedAt = new Date().toISOString();

  pushNotification(tech.username, `SPK Baru (${t.id}) — ${t.clientName}`, `Anda ditugaskan menangani ${t.assetType || 'AC'} ${t.brand} [${t.errorCode}] di ${t.buildingName} (${t.roomName}).`, 'warning', 'workorders');
  pushNotification(t.clientUsername, `Teknisi ${tech.name} Ditugaskan`, `Admin Eka menugaskan ${tech.name} (${tech.phone}) untuk tiket ${t.id} (${t.roomName}).`, 'info', 'tickets');
  addAuditLog('admin_eka', 'admin', t.city, `Menugaskan ${tech.name} (${tech.username}) untuk ${t.id} (${t.clientName}).`);
  saveState();
  renderDashboard();
  showToast(`Teknisi ${tech.name} berhasil ditugaskan untuk ${t.id}!`, 'success');
}

function setClientBuildingFilter(bldId) { clientSelectedBuildingId = bldId; renderDashboard(); }

function renderClientUnits(container, acc) {
  const client = getClientRecordForAccount(acc);
  if (!client) return;
  if (!clientSelectedBuildingId || !client.buildings.some((b) => b.id === clientSelectedBuildingId)) {
    clientSelectedBuildingId = client.buildings[0].id;
  }
  const activeBld = client.buildings.find((b) => b.id === clientSelectedBuildingId);
  const rooms = activeBld.rooms.filter((r) => clientRoomStatusFilter === 'all' || r.status === clientRoomStatusFilter);

  const bldTabs = client.buildings.map((b) => `
    <button type="button" onclick="setClientBuildingFilter('${b.id}')" class="px-3.5 py-2 rounded-xl text-xs font-semibold border transition ${b.id === activeBld.id ? 'bg-slate-900 text-white border-slate-900' : 'bg-white text-slate-600 border-slate-200 hover:bg-slate-100'}">${escapeHtml(b.name)} (${escapeHtml(b.brand)})</button>
  `).join('');

  const statusTabs = ['all', 'Normal', 'Standby', 'Error'].map((st) => `
    <button type="button" onclick="setClientRoomStatusFilter('${st}')" class="px-3 py-1.5 rounded-lg text-xs font-semibold border transition ${clientRoomStatusFilter === st ? 'bg-teal-600 text-white border-teal-600' : 'bg-slate-50 text-slate-600 border-slate-200 hover:bg-slate-100'}">${st === 'all' ? 'Semua' : st}</button>
  `).join('');

  const roomCards = rooms.length === 0
    ? '<div class="col-span-full bg-white rounded-2xl border border-slate-200 p-8 text-center text-xs text-slate-500">Tidak ada ruangan dengan filter status ini.</div>'
    : rooms.map((r) => {
        const badgeCls = r.status === 'Error' ? 'bg-rose-100 text-rose-700 border-rose-200' : r.status === 'Standby' ? 'bg-amber-100 text-amber-700 border-amber-200' : 'bg-emerald-100 text-emerald-700 border-emerald-200';
        const cardBorder = r.status === 'Error' ? 'border-rose-300 bg-rose-50/30' : 'border-slate-200 bg-white';
        return `
          <div onclick="openRoomDetailModal('${client.id}', '${activeBld.id}', '${r.id}')" class="cursor-pointer rounded-2xl border ${cardBorder} hover:border-teal-500 hover:shadow-md transition p-4 space-y-3">
            <div class="flex items-start justify-between gap-2">
              <div class="min-w-0"><span class="font-mono text-[10px] font-semibold text-slate-500">${escapeHtml(r.unitId)} &bull; ${escapeHtml(r.floor)}</span><h4 class="text-sm font-bold text-slate-900 truncate">${escapeHtml(r.name)}</h4></div>
              <span class="px-2 py-0.5 rounded-full text-[10px] font-bold border ${badgeCls} shrink-0">${escapeHtml(r.status)}</span>
            </div>
            <div class="grid grid-cols-3 gap-2 text-center bg-slate-50 rounded-xl p-2.5 border border-slate-100">
              <div><span class="text-[10px] text-slate-400 block">Suhu Aktual</span><span class="text-sm font-extrabold ${r.status === 'Error' ? 'text-rose-600' : 'text-slate-900'}">${r.temp}°C</span></div>
              <div><span class="text-[10px] text-slate-400 block">Target</span><span class="text-sm font-bold text-teal-700">${r.targetTemp}°C</span></div>
              <div><span class="text-[10px] text-slate-400 block">Mode / Daya</span><span class="text-xs font-semibold text-slate-700">${escapeHtml(r.mode)} &bull; ${r.powerKw} kW</span></div>
            </div>
          </div>
        `;
      }).join('');

  const myInstallReqs = (state.installRequests || []).filter((r) => r.clientId === client.id && r.status === 'Menunggu Pemasangan');
  const reqNotice = myInstallReqs.length === 0 ? '' : `
    <div class="bg-sky-50 border border-sky-200 rounded-2xl p-3.5 flex flex-wrap items-center justify-between gap-2 text-xs text-sky-900">
      <div><strong>${myInstallReqs.length} Permohonan Instalasi Baru</strong> menunggu pemrosesan Admin Partner (${myInstallReqs.map((r) => escapeHtml(r.roomName)).join(', ')}).</div>
      <span class="px-2.5 py-0.5 rounded-full bg-sky-100 text-sky-800 font-semibold text-[11px]">Menunggu Pemasangan</span>
    </div>
  `;

  container.innerHTML = `<div class="bg-white rounded-2xl border border-slate-200 p-4 flex flex-col lg:flex-row lg:items-center justify-between gap-3"><div class="flex flex-wrap gap-2">${bldTabs}</div><div class="flex flex-wrap items-center justify-between gap-2"><div class="flex flex-wrap gap-1.5">${statusTabs}</div><button type="button" onclick="openClientRequestAssetModal('AC')" class="px-3.5 py-1.5 rounded-xl bg-teal-600 hover:bg-teal-700 text-white text-xs font-bold transition flex items-center gap-1.5"><i data-lucide="plus-circle" class="w-3.5 h-3.5"></i><span>+ Ajukan Instalasi Unit Baru</span></button></div></div>${reqNotice}<div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">${roomCards}</div>`;
}

function openRoomDetailModal(clientId, buildingId, roomId) {
  const client = state.clients.find((c) => c.id === clientId);
  const bld = client && client.buildings.find((b) => b.id === buildingId);
  const room = bld && bld.rooms.find((r) => r.id === roomId);
  if (!room) return;
  const rule = room.errorCode ? lookupErrorRule(bld.brand, room.errorCode) : null;

  openModal(`
    <div class="px-5 py-4 bg-slate-900 text-white flex items-center justify-between">
      <div><h3 class="text-sm font-bold">${escapeHtml(room.name)}</h3><p class="text-[11px] text-slate-400">${escapeHtml(bld.fullName)} &bull; ${escapeHtml(room.floor)} &bull; ${escapeHtml(room.unitId)}</p></div>
      <button type="button" onclick="closeModal()" class="p-1 text-slate-400 hover:text-white"><i data-lucide="x" class="w-4 h-4"></i></button>
    </div>
    <div class="p-5 space-y-4">
      <div class="grid grid-cols-4 gap-2 text-center">
        <div class="bg-slate-50 rounded-xl p-2.5 border border-slate-200"><span class="text-[10px] text-slate-400 block">Aktual</span><span class="text-base font-extrabold ${room.status === 'Error' ? 'text-rose-600' : 'text-slate-900'}">${room.temp}°C</span></div>
        <div class="bg-slate-50 rounded-xl p-2.5 border border-slate-200"><span class="text-[10px] text-slate-400 block">Target</span><span class="text-base font-bold text-teal-700">${room.targetTemp}°C</span></div>
        <div class="bg-slate-50 rounded-xl p-2.5 border border-slate-200"><span class="text-[10px] text-slate-400 block">Mode</span><span class="text-sm font-bold text-slate-800">${escapeHtml(room.mode)}</span></div>
        <div class="bg-slate-50 rounded-xl p-2.5 border border-slate-200"><span class="text-[10px] text-slate-400 block">Daya</span><span class="text-sm font-bold text-slate-800">${room.powerKw} kW</span></div>
      </div>
      ${rule ? `<div class="rounded-xl bg-rose-50 border border-rose-200 p-3.5 space-y-1"><div class="text-xs font-bold text-rose-800">Status Gangguan Pendinginan</div><p class="text-xs text-rose-700 leading-relaxed">${escapeHtml(rule.humanTranslation)}</p></div>` : ''}
      <div><div class="text-xs font-bold text-slate-800 mb-2">Grafik Tren Suhu 6 Jam Terakhir (°C)</div><div class="h-52"><canvas id="modalRoomTempChart"></canvas></div></div>
    </div>
  `, 'max-w-xl');

  renderChart('modalRoomTempChart', {
    type: 'line',
    data: {
      labels: ['-5 Jam', '-4 Jam', '-3 Jam', '-2 Jam', '-1 Jam', 'Saat Ini'],
      datasets: [
        { label: 'Suhu Aktual (°C)', data: room.tempHistory6h, borderColor: room.status === 'Error' ? '#e11d48' : '#0d9488', backgroundColor: room.status === 'Error' ? 'rgba(225,29,72,0.12)' : 'rgba(13,148,136,0.12)', fill: true, tension: 0.35, borderWidth: 2.5 },
        { label: 'Target Suhu (°C)', data: room.tempHistory6h.map(() => room.targetTemp), borderColor: '#64748b', borderDash: [5, 5], borderWidth: 1.5, pointRadius: 0 }
      ]
    },
    options: { responsive: true, maintainAspectRatio: false, scales: { y: { suggestedMin: 17, suggestedMax: 30 } } }
  });
}

function renderClientEnergy(container, acc) {

  container.innerHTML = `

      <div class="bg-white rounded-2xl border border-slate-200 p-4"><div class="text-xs text-slate-500 mb-1">Baseline vs Actual Smart BMS/bln</div><div class="text-2xl font-extrabold text-slate-900">${roi.actualKwhMonth.toLocaleString('id-ID')} kWh</div><div class="text-[11px] text-emerald-600 font-semibold mt-1">Turun dari baseline ${roi.baselineKwhMonth.toLocaleString('id-ID')} kWh</div></div>
      <div class="bg-white rounded-2xl border border-slate-200 p-4"><div class="text-xs text-slate-500 mb-1">Penghematan Tagihan Listrik/Bln</div><div class="text-2xl font-extrabold text-emerald-700">${formatRp(roi.energySavedRpMonth)}</div><div class="text-[11px] text-slate-500 mt-1">Efek Smart Scheduling &amp; WBP PLN</div></div>

      <div class="bg-white rounded-2xl border border-slate-200 p-5"><h3 class="text-sm font-bold text-slate-900 mb-4">Konsumsi Listrik Harian (7 Hari Terakhir)</h3><div class="h-72"><canvas id="clientDailyKwhChart"></canvas></div></div>
      <div class="bg-white rounded-2xl border border-slate-200 p-5"><h3 class="text-sm font-bold text-slate-900 mb-4">Baseline vs Actual kWh Antar Gedung</h3><div class="h-72"><canvas id="clientBuildingKwhChart"></canvas></div></div>
    </div>
  `;

  renderChart('clientDailyKwhChart', {
    type: 'line',
    data: { labels: ['H-6', 'H-5', 'H-4', 'H-3', 'H-2', 'Kemarin', 'Hari Ini'], datasets: [{ label: 'kWh/Hari', data: daily7, borderColor: '#0d9488', backgroundColor: 'rgba(13, 148, 136, 0.14)', fill: true, tension: 0.35, borderWidth: 2.5 }] },
    options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: false } } }
  });

  renderChart('clientBuildingKwhChart', {
    type: 'bar',
    data: {
      labels: client.buildings.map((b) => b.name),
      datasets: [
        { label: 'Baseline (Tanpa BMS)', data: client.buildings.map((b) => computeBuildingSavings(b).baselineKwhMonth), backgroundColor: '#94a3b8', borderRadius: 6 },
        { label: 'Actual (Dengan Smart BMS)', data: client.buildings.map((b) => computeBuildingSavings(b).actualKwhMonth), backgroundColor: '#0d9488', borderRadius: 6 }
      ]
    },
    options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true } } }

function renderClientTickets(container, acc) {
  const client = getClientRecordForAccount(acc);
  if (!client) return;
  const myTickets = state.tickets.filter((t) => t.clientId === client.id);
  const active = myTickets.filter((t) => t.status !== 'Selesai');
  const history = myTickets.filter((t) => t.status === 'Selesai');
  const steps = ['Menunggu Penugasan', 'Teknisi Ditugaskan', 'Menuju Lokasi', 'Sedang Diperbaiki', 'Selesai'];

  const activeHtml = active.length === 0
    ? '<div class="bg-white rounded-2xl border border-slate-200 p-8 text-center text-xs text-slate-500">Tidak ada tiket perbaikan aktif saat ini.</div>'
    : active.map((t) => {
        const rule = lookupErrorRule(t.brand, t.errorCode);
        const tech = t.assignedTo ? state.accounts.find((a) => a.username === t.assignedTo) : null;
        const relInv = (state.invoices || []).find((inv) => inv.ticketId === t.id);
        const currentIdx = Math.max(0, steps.indexOf(t.status));
        return `
          <div class="bg-white rounded-2xl border border-slate-200 p-5 space-y-4">
            <div class="flex flex-wrap items-start justify-between gap-2">
              <div>
                <div class="flex items-center gap-2 mb-1"><span class="font-mono text-xs font-bold bg-slate-100 px-2 py-0.5 rounded">${escapeHtml(t.id)}</span><span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-slate-900 text-white">${escapeHtml(t.assetType || 'AC')}</span><span class="text-xs font-semibold text-rose-600">${escapeHtml(t.status)}</span></div>
                <h3 class="text-base font-bold text-slate-900">${escapeHtml(t.buildingName)} (${escapeHtml(t.floor)}) &mdash; ${escapeHtml(t.roomName)}</h3>
                <p class="text-xs text-slate-600 mt-1">${escapeHtml(rule.humanTranslation)}</p>
              </div>
              ${tech ? `<div class="bg-teal-50 border border-teal-200 rounded-xl px-3.5 py-2 text-xs"><div class="text-[10px] font-bold uppercase text-teal-700">Teknisi</div><div class="font-bold text-slate-900">${escapeHtml(tech.name)}</div><div class="text-slate-600 font-mono">${escapeHtml(tech.phone)}</div></div>` : '<span class="px-3 py-1 rounded-xl bg-amber-50 border border-amber-200 text-xs font-semibold text-amber-800">Menunggu Admin Partner</span>'}
            </div>
            <div class="grid grid-cols-2 sm:grid-cols-5 gap-2 pt-2">
              ${steps.map((st, idx) => `<div class="rounded-xl p-2.5 border text-center transition ${idx === currentIdx ? 'bg-teal-600 text-white border-teal-600 shadow-sm' : idx < currentIdx ? 'bg-emerald-50 text-emerald-800 border-emerald-200' : 'bg-slate-50 text-slate-400 border-slate-200'}"><div class="text-[10px] font-bold mb-0.5">Tahap ${idx + 1}</div><div class="text-[11px] font-semibold leading-tight">${st}</div></div>`).join('')}
            </div>
            ${relInv ? `<div class="pt-3 border-t border-slate-100 flex flex-wrap items-center justify-between gap-2 bg-slate-50 rounded-xl p-3"><div class="text-xs text-slate-700"><strong>Quotation / Invoice (${escapeHtml(relInv.invNumber || relInv.id)}):</strong> <span class="font-bold text-slate-900">${formatRp(relInv.grandTotal)}</span> <span class="ml-1 px-2 py-0.5 rounded-full text-[10px] font-bold bg-amber-100 text-amber-800">${escapeHtml(relInv.status)}</span></div><div class="flex items-center gap-2"><button type="button" onclick="openInvoiceBastModal('${relInv.id}')" class="px-3 py-1.5 rounded-lg border border-slate-200 bg-white text-[11px] font-semibold text-slate-700">Lihat Dokumen</button>${relInv.status === 'Menunggu Persetujuan Klien' ? `<button type="button" onclick="approveQuotationPO('${relInv.id}')" class="px-3 py-1.5 rounded-lg bg-teal-600 text-white text-[11px] font-bold">Setujui RAB &amp; Terbitkan PO</button>` : ''}</div></div>` : ''}
          </div>
        `;
      }).join('');

  container.innerHTML = `
    <div class="space-y-4"><h2 class="text-sm font-bold text-slate-900">Pelacakan Tiket Perbaikan AC &amp; Lift (${active.length})</h2>${activeHtml}</div>
    <div class="bg-white rounded-2xl border border-slate-200 p-5">
      <h3 class="text-sm font-bold text-slate-900 mb-3">Riwayat Perbaikan Selesai (${history.length})</h3>

function updateClientChatbotContext(acc) {
  const client = getClientRecordForAccount(acc);
  if (!client) return;
  const errRooms = getClientErrorRooms(client);
  const myLifts = state.elevators.filter((e) => e.clientId === client.id);
  const liftAlerts = myLifts.filter((e) => e.k3Status !== 'Layak K3');
  const badge = document.getElementById('chatbot-error-badge');
  const alertTotal = errRooms.length + liftAlerts.length;
  if (alertTotal > 0) { badge.textContent = alertTotal; badge.classList.remove('hidden'); }
  else { badge.classList.add('hidden'); }
  document.getElementById('chatbot-context-sub').textContent = `${client.name} (${errRooms.length} AC & ${liftAlerts.length} K3 Lift)`;

  if (chatbotInitializedForUser !== acc.username) {
    chatbotInitializedForUser = acc.username;
    const roi = computeScopeROI(client.buildings);
    chatbotMessages = [{
      sender: 'ai',
      text: `Halo tim **${client.name}**! Smart Scheduling Anda saat ini memproyeksikan penurunan overhead **${roi.overheadReductionPct}%** (${formatRpShort(roi.totalSavedRpYear)}/thn).\n\n${errRooms.length > 0 ? `Terdeteksi gangguan di **${errRooms[0].room.name}** (${errRooms[0].building.name}). ` : ''}${liftAlerts.length > 0 ? `Ada **${liftAlerts.length} unit lift** yang perlu pengajuan Riksa Uji K3 PJK3.` : 'Seluruh Suket K3 Lift aktif.'}`
    }];
    renderChatbotMessages();
  }
}

function toggleChatbot(forceState) {
  const panel = document.getElementById('chatbot-panel');
  const open = typeof forceState === 'boolean' ? forceState : panel.classList.contains('hidden');
  if (open) { panel.classList.remove('hidden'); renderChatbotMessages(); }
  else { panel.classList.add('hidden'); }
}

function renderChatbotMessages() {
  const box = document.getElementById('chatbot-messages');
  if (!box) return;
  box.innerHTML = chatbotMessages.map((m) => `
    <div class="flex ${m.sender === 'user' ? 'justify-end' : 'justify-start'}">
      <div class="max-w-[85%] rounded-2xl px-3.5 py-2.5 text-xs leading-relaxed whitespace-pre-line ${m.sender === 'user' ? 'bg-teal-600 text-white rounded-br-sm' : 'bg-white border border-slate-200 text-slate-800 rounded-bl-sm shadow-2xs'}">${escapeHtml(m.text).replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')}</div>
    </div>
  `).join('');
  box.scrollTop = box.scrollHeight;
}

function handleChatbotQuickReply(type) {
  const acc = getCurrentAccount();
  if (!acc || acc.role !== 'client') return;
  const client = getClientRecordForAccount(acc);
  const errRooms = getClientErrorRooms(client);
  if (type === 'emergency') {
    chatbotMessages.push({ sender: 'user', text: 'Panduan Tindakan Darurat' });
    chatbotMessages.push({ sender: 'ai', text: errRooms.length > 0 ? `Tindakan aman untuk **${errRooms[0].room.name}**:\n1. Jangan matikan MCB utama agar sensor log tetap aktif.\n2. Atur unit ke mode **Fan Only** atau pindahkan aktivitas ke zona sejuk.\n3. Pastikan pintu ruangan tertutup rapat.` : 'Tidak ada kondisi darurat AC saat ini. Pastikan jadwal Auto Cut-Off zona perkantoran aktif.' });
  } else if (type === 'savings') {
    const roi = computeScopeROI(client.buildings);
    chatbotMessages.push({ sender: 'user', text: 'Proyeksi Hemat Overhead' });
    chatbotMessages.push({ sender: 'ai', text: `Total proyeksi penghematan **${client.name}** adalah **${roi.overheadReductionPct}%** (**${formatRpShort(roi.totalSavedRpYear)}/tahun**): hemat listrik ${formatRpShort(roi.energySavedRpMonth * 12)}/thn, avoided breakdown ${formatRpShort(roi.avoidedBreakdownRpMonth * 12)}/thn, & efisiensi kontrak ${formatRpShort(roi.bundledContractRpMonth * 12)}/thn.` });
  } else if (type === 'lift') {
    const lifts = state.elevators.filter((e) => e.clientId === client.id);
    const alerts = lifts.filter((e) => e.k3Status !== 'Layak K3');
    chatbotMessages.push({ sender: 'user', text: 'Status Lift & K3' });
    chatbotMessages.push({ sender: 'ai', text: `Dari **${lifts.length} unit lift** milik Anda, **${lifts.length - alerts.length} unit** berstatus Layak K3. ${alerts.length > 0 ? `Unit perlu Riksa Uji: **${alerts.map((l) => l.name + ' (' + l.k3Status + ')').join(', ')}**. Buka tab Monitoring Lift & Riksa Uji untuk kirim permohonan ke @pjk3_jatim.` : 'Semua Suket K3 Lift masih berlaku.'}` });
  } else if (type === 'urgent') {
    requestUrgentTechnician(acc, client, errRooms);
    return;
  }
  renderChatbotMessages();
}

function requestUrgentTechnician(acc, client, errRooms) {
  chatbotMessages.push({ sender: 'user', text: 'Minta Teknisi Datang Sekarang' });
  const targetDetail = errRooms.length > 0 ? `${errRooms[0].building.name} - ${errRooms[0].room.name}` : `${client.buildings[0].name}`;
  pushNotification('admin_eka', `URGENT REQUEST dari ${client.name} (${client.city})`, `Klien meminta teknisi segera datang ke lokasi (${targetDetail}) melalui Asisten AI Nexus.`, 'error', 'errors');
  addAuditLog(acc.username, 'client', client.city, `Mengirim permintaan teknisi prioritas (URGENT) untuk ${targetDetail}.`);
  saveState();
  chatbotMessages.push({ sender: 'ai', text: `Permintaan darurat telah dikirim ke **Admin Eka** untuk area **${client.city}** (${targetDetail}).` });
  renderChatbotMessages();
  showToast('Permintaan teknisi darurat terkirim ke Admin Eka!', 'success');
}

function handleChatbotSubmit(e) {
  e.preventDefault();
  const input = document.getElementById('chatbot-input');
  const txt = input.value.trim();
  if (!txt) return;
  input.value = '';
  const acc = getCurrentAccount();
  const client = getClientRecordForAccount(acc);
  chatbotMessages.push({ sender: 'user', text: txt });
  const lower = txt.toLowerCase();
  let reply = '';
  if (lower.includes('lift') || lower.includes('k3') || lower.includes('pjk3') || lower.includes('suket')) {
    const lifts = state.elevators.filter((l) => l.clientId === client.id);
    const alerts = lifts.filter((l) => l.k3Status !== 'Layak K3');
    reply = `Anda memiliki **${lifts.length} unit lift**. ${alerts.length > 0 ? `Perhatian K3: **${alerts.map((a) => a.name + ' [' + a.k3Status + ']').join(', ')}**. Anda dapat langsung mengajukan Riksa Uji PJK3 di menu Monitoring Lift.` : 'Seluruh lift Anda Layak K3.'}`;
  } else if (lower.includes('hemat') || lower.includes('roi') || lower.includes('overhead') || lower.includes('jadwal') || lower.includes('listrik')) {
    const roi = computeScopeROI(client.buildings);
    reply = `Dengan Smart Scheduling aktif, proyeksi penurunan overhead **${client.name}** mencapai **${roi.overheadReductionPct}%** (${formatRpShort(roi.totalSavedRpYear)}/tahun) dan penghematan **${roi.savedKwhYear.toLocaleString('id-ID')} kWh/tahun**.`;
  } else if (lower.includes('starkes') || lower.includes('akreditasi')) {
    const st = computeStarkesIndex(client);
    reply = st ? `Skor Kesiapan Akreditasi **STARKES Bab MFK** Anda saat ini **${st.totalScore}% (${st.label})**.` : `Fitur STARKES Bab MFK khusus untuk fasilitas Rumah Sakit; gedung Anda dipantau melalui Kepatuhan Permenaker 6/2017.`;
  } else {
    const errRooms = getClientErrorRooms(client);
    reply = errRooms.length > 0 ? `Ada gangguan pada **${errRooms[0].room.name}** (${errRooms[0].building.name}). Klik "Minta Teknisi Sekarang" untuk eskalasi cepat ke Admin Eka.` : `Seluruh unit AC di **${client.name}** terpantau normal. Anda dapat menanyakan status Lift K3, jadwal hemat, atau ROI overhead.`;
  }
  chatbotMessages.push({ sender: 'ai', text: reply });
  renderChatbotMessages();
}

function toggleChecklistItem(ticketId, idx) {

  t.checklistDone[idx] = !t.checklistDone[idx];

}

function acceptTechTicket(ticketId) {
  const acc = getCurrentAccount();
  const t = state.tickets.find((x) => x.id === ticketId && x.assignedTo === acc.username);
  if (!t) return;
  t.techAccepted = true; t.updatedAt = new Date().toISOString(); acc.techStatus = 'On-Duty';

  pushNotification(t.clientUsername, `Teknisi ${acc.name} Mengonfirmasi Tugas`, `Teknisi bersiap menuju ${t.buildingName} (${t.roomName}).`, 'info', 'tickets');
  addAuditLog(acc.username, 'technician', acc.city, `Menerima SPK ${t.id} (${t.clientName}).`);
  saveState(); renderDashboard();
  showToast(`SPK ${t.id} diterima!`, 'success');
}

function advanceTechTicket(ticketId, nextStatus) {

function claimQueueTicket(ticketId) {

function submitCompleteWo(e, ticketId) {
  e.preventDefault();
  const acc = getCurrentAccount();
  const t = state.tickets.find((x) => x.id === ticketId && x.assignedTo === acc.username);
  if (!t) return;
  const notes = document.getElementById('wo-repair-notes').value.trim();
  const parts = document.getElementById('wo-parts-used').value.trim();
  const nowIso = new Date().toISOString();
  t.status = 'Selesai'; t.completedAt = nowIso; t.updatedAt = nowIso; t.repairNotes = notes; t.partsUsed = parts;

  if (t.assetType === 'Lift') {
    const elv = state.elevators.find((x) => x.id === t.unitId || x.id === t.roomId);
    if (elv) { elv.iotStatus = 'Normal'; elv.errorCode = null; }
  } else {
    const client = state.clients.find((c) => c.id === t.clientId);
    const bld = client && client.buildings.find((b) => b.id === t.buildingId);
    const room = bld && bld.rooms.find((r) => r.id === t.roomId);
    if (room) {
      room.status = 'Normal'; room.errorCode = null; room.mode = 'Cool';
      room.temp = room.targetTemp; room.tempHistory6h = [...room.tempHistory6h.slice(1), room.targetTemp];
    }
  }

  const otherActive = state.tickets.some((x) => x.assignedTo === acc.username && x.status !== 'Selesai');
  if (!otherActive) acc.techStatus = 'Available';

  const relInv = (state.invoices || []).find((inv) => inv.ticketId === t.id && inv.status !== 'Lunas' && !inv.invNumber);
  if (relInv) {
    const seq = String((state.invoices || []).filter((x) => x.invNumber).length + 1).padStart(3, '0');
    relInv.invNumber = `INV-2026-${seq}`;
    relInv.bastNumber = `BAST-2026-${seq}`;
    if (!relInv.poNumber) relInv.poNumber = `PO-AUTO-2026-${seq}`;
    relInv.invoicedAt = nowIso;
    relInv.approvedAt = relInv.approvedAt || nowIso;
    relInv.status = 'Menunggu Pembayaran';
    pushNotification(t.clientUsername, `Invoice ${relInv.invNumber} & BAST Digital Terbit`, `Pekerjaan ${t.id} selesai. Invoice resmi ${relInv.invNumber} (${formatRp(relInv.grandTotal)}) & BAST Digital siap ditinjau.`, 'info', 'billing');
    pushNotification('admin_eka', `Invoice ${relInv.invNumber} Otomatis Terbit`, `WO ${t.id} selesai; Invoice & BAST Digital untuk ${t.clientName} (${formatRp(relInv.grandTotal)}) diterbitkan.`, 'success', 'billing');
  }

  pushNotification('admin_eka', `WO ${t.id} Selesai oleh ${acc.name}`, `${t.clientName} (${t.buildingName} - ${t.roomName}) kembali Normal.`, 'success', 'errors');
  pushNotification(t.clientUsername, `Perbaikan ${t.roomName} Selesai!`, `Teknisi ${acc.name} telah menyelesaikan perbaikan (${t.assetType || 'AC'}).`, 'success', 'tickets');
  addAuditLog(acc.username, 'technician', acc.city, `Menyelesaikan ${t.id} (${t.clientName} - ${t.roomName}).`);
  saveState(); closeModal(); renderDashboard();
  showToast(`Work Order ${t.id} selesai! Unit kembali Normal.${relInv ? ' Invoice & BAST otomatis terbit.' : ''}`, 'success');
}

      </div>

}

function recalcQuotationPreview() {
  const box = document.getElementById('qt-summary-box');
  if (!box) return;
  let partsTotal = 0;
  let count = 0;
  document.querySelectorAll('.qt-part-check').forEach((chk) => {
    if (chk.checked) {
      const partId = chk.getAttribute('data-part-id');
      const part = SPAREPART_CATALOG.find((p) => p.id === partId);
      const qtyEl = document.querySelector(`.qt-part-qty[data-part-id="${partId}"]`);
      const qty = Math.max(1, parseInt(qtyEl ? qtyEl.value : '1', 10) || 1);
      if (part) { partsTotal += part.price * qty; count++; }
    }
  });
  const includeLabor = document.getElementById('qt-include-labor')?.checked;
  const labor = includeLabor ? SERVICE_LABOR_FEE : 0;
  const subtotal = partsTotal + labor;
  const ppn = Math.round(subtotal * PPN_RATE);
  const grandTotal = subtotal + ppn;

  box.innerHTML = `
    <div class="flex justify-between text-slate-300"><span>Sparepart Terpilih (${count} item)</span><span>${formatRp(partsTotal)}</span></div>
    <div class="flex justify-between text-slate-300"><span>Jasa Instalasi &amp; Kalibrasi</span><span>${formatRp(labor)}</span></div>
    <div class="flex justify-between text-slate-300"><span>PPN 11%</span><span>${formatRp(ppn)}</span></div>
    <div class="pt-2 border-t border-slate-700 flex justify-between text-sm font-extrabold text-teal-300"><span>Total Penawaran (RAB)</span><span>${formatRp(grandTotal)}</span></div>
  `;
}

function submitCreateQuotation(e, ticketId) {
  e.preventDefault();
  const acc = getCurrentAccount();
  const t = state.tickets.find((x) => x.id === ticketId);
  if (!t) return;
  const items = [];
  document.querySelectorAll('.qt-part-check').forEach((chk) => {
    if (chk.checked) {
      const partId = chk.getAttribute('data-part-id');
      const part = SPAREPART_CATALOG.find((p) => p.id === partId);
      const qtyEl = document.querySelector(`.qt-part-qty[data-part-id="${partId}"]`);
      const qty = Math.max(1, parseInt(qtyEl ? qtyEl.value : '1', 10) || 1);
      if (part) items.push({ partId: part.id, name: part.name, qty, unitPrice: part.price, lineTotal: part.price * qty });
    }
  });
  if (items.length === 0) { showToast('Pilih minimal 1 sparepart untuk Quotation RAB.', 'warning'); return; }

  const includeLabor = document.getElementById('qt-include-labor')?.checked;
  const laborFee = includeLabor ? SERVICE_LABOR_FEE : 0;
  const partsSum = items.reduce((s, it) => s + it.lineTotal, 0);
  const subtotal = partsSum + laborFee;
  const ppn = Math.round(subtotal * PPN_RATE);
  const grandTotal = subtotal + ppn;
  const notes = document.getElementById('qt-notes').value.trim();

  if (!Array.isArray(state.invoices)) state.invoices = [];
  const qtSeq = String(state.invoices.length + 1).padStart(3, '0');
  const qtId = `QT-2026-${qtSeq}`;
  const techAcc = t.assignedTo ? state.accounts.find((a) => a.username === t.assignedTo) : null;

  state.invoices.unshift({
    id: qtId, invNumber: null, bastNumber: null, poNumber: null,
    ticketId: t.id, assetType: t.assetType || 'AC',
    clientId: t.clientId, clientName: t.clientName, clientUsername: t.clientUsername,
    city: t.city, buildingName: t.buildingName, roomName: t.roomName, unitId: t.unitId, brand: t.brand,
    createdBy: acc ? acc.username : 'admin_eka',
    technicianName: techAcc ? techAcc.name : (acc ? acc.name : 'Tim Teknisi'),
    items, laborFee, subtotal, ppn, grandTotal, notes,
    status: 'Menunggu Persetujuan Klien', clientPaymentConfirmed: false,
    createdAt: new Date().toISOString(), approvedAt: null, invoicedAt: null, paidAt: null
  });

  pushNotification(t.clientUsername, `Quotation Sparepart ${t.assetType || 'AC'} Baru (${qtId})`, `RAB penggantian sparepart ${t.roomName} senilai ${formatRp(grandTotal)} menunggu persetujuan PO Anda.`, 'warning', 'billing');
  if (!acc || acc.username !== 'admin_eka') {
    pushNotification('admin_eka', `Quotation ${qtId} Diajukan untuk ${t.clientName}`, `Teknisi mengajukan RAB sparepart ${formatRp(grandTotal)} pada tiket ${t.id}.`, 'info', 'billing');
  }
  addAuditLog(acc ? acc.username : 'admin_eka', acc ? acc.role : 'admin', t.city, `Membuat Quotation RAB ${qtId} (${formatRp(grandTotal)}) untuk ${t.id}.`);

  saveState();
  closeModal();
  renderDashboard();
  showToast(`Quotation ${qtId} (${formatRp(grandTotal)}) berhasil dikirim ke ${t.clientName}!`, 'success');
}

function approveQuotationPO(invoiceId) {
  const acc = getCurrentAccount();
  const inv = (state.invoices || []).find((x) => x.id === invoiceId);
  if (!inv) return;
  const nowIso = new Date().toISOString();
  const seq = String((state.invoices || []).filter((x) => x.poNumber).length + 42).padStart(3, '0');
  inv.poNumber = `PO-KLIEN-2026-${seq}`;
  inv.approvedAt = nowIso;

  const relTicket = state.tickets.find((t) => t.id === inv.ticketId);
  if (relTicket && relTicket.status === 'Selesai') {
    const invSeq = String((state.invoices || []).filter((x) => x.invNumber).length + 1).padStart(3, '0');
    inv.invNumber = `INV-2026-${invSeq}`;
    inv.bastNumber = `BAST-2026-${invSeq}`;
    inv.invoicedAt = nowIso;
    inv.status = 'Menunggu Pembayaran';
  } else {
    inv.status = 'PO Disetujui (Proses Pasang)';
  }

  pushNotification('admin_eka', `PO Disetujui Klien: ${inv.poNumber}`, `${inv.clientName} menyetujui RAB ${inv.id} (${formatRp(inv.grandTotal)}). Teknisi siap memasang sparepart.`, 'success', 'billing');
  if (relTicket && relTicket.assignedTo) {
    pushNotification(relTicket.assignedTo, `PO ${inv.poNumber} Disetujui Klien`, `Klien ${inv.clientName} menyetujui penggantian sparepart untuk ${inv.ticketId}.`, 'success', 'workorders');
  }
  addAuditLog(acc ? acc.username : inv.clientUsername, 'client', inv.city, `Menyetujui RAB ${inv.id} dan menerbitkan ${inv.poNumber}.`);

  saveState();
  closeModal();
  renderDashboard();
  showToast(`RAB disetujui! Nomor PO ${inv.poNumber} berhasil diterbitkan.`, 'success');
}

function issueInvoiceFromPo(invoiceId) {
  const inv = (state.invoices || []).find((x) => x.id === invoiceId);
  if (!inv) return;
  const nowIso = new Date().toISOString();
  const seq = String((state.invoices || []).filter((x) => x.invNumber).length + 1).padStart(3, '0');
  inv.invNumber = inv.invNumber || `INV-2026-${seq}`;
  inv.bastNumber = inv.bastNumber || `BAST-2026-${seq}`;
  inv.poNumber = inv.poNumber || `PO-ADM-2026-${seq}`;
  inv.invoicedAt = nowIso;
  inv.status = 'Menunggu Pembayaran';
  pushNotification(inv.clientUsername, `Invoice ${inv.invNumber} & BAST Terbit`, `Tagihan resmi ${inv.invNumber} senilai ${formatRp(inv.grandTotal)} & BAST Digital tersedia.`, 'info', 'billing');
  addAuditLog('admin_eka', 'admin', inv.city, `Menerbitkan Invoice ${inv.invNumber} & BAST ${inv.bastNumber} untuk ${inv.clientName}.`);
  saveState();
  renderDashboard();
  showToast(`Invoice ${inv.invNumber} & BAST Digital diterbitkan!`, 'success');
}

function confirmClientPayment(invoiceId) {
  const acc = getCurrentAccount();
  const inv = (state.invoices || []).find((x) => x.id === invoiceId);
  if (!inv) return;
  inv.clientPaymentConfirmed = true;
  pushNotification('admin_eka', `Konfirmasi Pembayaran dari ${inv.clientName}`, `Klien mengonfirmasi transfer untuk ${inv.invNumber || inv.id} (${formatRp(inv.grandTotal)}).`, 'info', 'billing');
  addAuditLog(acc ? acc.username : inv.clientUsername, 'client', inv.city, `Mengirim konfirmasi pembayaran untuk ${inv.invNumber || inv.id}.`);
  saveState();
  renderDashboard();
  showToast('Konfirmasi pembayaran terkirim ke Admin Eka!', 'success');
}

function markInvoicePaid(invoiceId) {
  const inv = (state.invoices || []).find((x) => x.id === invoiceId);
  if (!inv) return;
  const nowIso = new Date().toISOString();
  if (!inv.invNumber) {
    const seq = String((state.invoices || []).filter((x) => x.invNumber).length + 1).padStart(3, '0');
    inv.invNumber = `INV-2026-${seq}`;
    inv.bastNumber = `BAST-2026-${seq}`;
    inv.invoicedAt = inv.invoicedAt || nowIso;
  }
  inv.status = 'Lunas';
  inv.clientPaymentConfirmed = true;
  inv.paidAt = nowIso;
  pushNotification(inv.clientUsername, `Pembayaran ${inv.invNumber} Lunas`, `Terima kasih! Pembayaran ${formatRp(inv.grandTotal)} untuk ${inv.roomName} telah diverifikasi Lunas.`, 'success', 'billing');
  addAuditLog('admin_eka', 'admin', inv.city, `Menandai ${inv.invNumber} (${inv.clientName}) sebagai Lunas.`);
  saveState();
  closeModal();
  renderDashboard();
  showToast(`${inv.invNumber} ditandai Lunas!`, 'success');
}

function switchAddAssetType(type) {
  document.getElementById('asset-add-type').value = type;
  const acSec = document.getElementById('asset-section-ac');
  const liftSec = document.getElementById('asset-section-lift');
  const btnAc = document.getElementById('btn-type-ac');
  const btnLift = document.getElementById('btn-type-lift');
  if (type === 'AC') {
    acSec.classList.remove('hidden'); liftSec.classList.add('hidden');
    btnAc.className = 'py-2.5 px-3 rounded-xl border text-xs font-bold transition bg-teal-600 text-white border-teal-600';
    btnLift.className = 'py-2.5 px-3 rounded-xl border text-xs font-bold transition bg-slate-50 text-slate-700 border-slate-200';
  } else {
    liftSec.classList.remove('hidden'); acSec.classList.add('hidden');
    btnLift.className = 'py-2.5 px-3 rounded-xl border text-xs font-bold transition bg-indigo-600 text-white border-indigo-600';
    btnAc.className = 'py-2.5 px-3 rounded-xl border text-xs font-bold transition bg-slate-50 text-slate-700 border-slate-200';
  }
}

function updateEnterpriseAssetBuildings(preferredBldId = null) {
  const clientId = document.getElementById('asset-add-client')?.value;
  const bldSel = document.getElementById('asset-add-building');
  const gwBadge = document.getElementById('asset-gateway-badge');
  if (!clientId || !bldSel) return;
  const client = state.clients.find((c) => c.id === clientId);
  if (!client) return;
  bldSel.innerHTML = client.buildings.map((b) => `<option value="${b.id}" ${preferredBldId === b.id ? 'selected' : ''}>${escapeHtml(b.name)} (${escapeHtml(b.gatewayId)})</option>`).join('');
  const refreshGw = () => {
    const b = client.buildings.find((x) => x.id === bldSel.value) || client.buildings[0];
    if (gwBadge && b) gwBadge.innerHTML = `Terhubung ke Edge Gateway <strong>${escapeHtml(b.gatewayId)}</strong> (${escapeHtml(b.protocol)}) &bull; Status: ${escapeHtml(b.gatewayStatus)}`;
  };
  bldSel.onchange = refreshGw;
  refreshGw();
}

function submitAddAsset(e, prefillReqId = null) {
  e.preventDefault();
  const acc = getCurrentAccount();
  const type = document.getElementById('asset-add-type').value;
  const clientId = document.getElementById('asset-add-client').value;
  const buildingId = document.getElementById('asset-add-building').value;
  const client = state.clients.find((c) => c.id === clientId);
  const bld = client && client.buildings.find((b) => b.id === buildingId);
  if (!client || !bld) return;

  if (type === 'AC') {
    const floor = document.getElementById('ent-ac-floor').value.trim() || 'Lt. 1';
    const roomName = document.getElementById('ent-ac-room').value.trim();
    if (!roomName) { showToast('Nama ruangan AC baru wajib diisi.', 'warning'); return; }
    const unitId = document.getElementById('ent-ac-unitid').value.trim().toUpperCase();
    const brand = document.getElementById('ent-ac-brand').value;
    const cap = document.getElementById('ent-ac-cap').value;
    const zoneType = document.getElementById('ent-ac-zone').value;
    const targetTemp = parseFloat(document.getElementById('ent-ac-target').value) || 22.0;
    const kwMatch = cap.match(/([\d.]+)\s*kW/i);
    const powerKw = kwMatch ? parseFloat(kwMatch[1]) : 4.5;

    bld.rooms.unshift({
      id: 'rm_new_' + Date.now(), unitId, floor, name: roomName,
      temp: targetTemp, targetTemp, mode: 'Cool', powerKw,
      status: 'Normal', errorCode: null, zoneType,
      tempHistory6h: [targetTemp + 0.3, targetTemp + 0.2, targetTemp + 0.1, targetTemp, targetTemp, targetTemp]
    });
    bld.iduCount += 1;
    if (!client.brands.includes(brand)) client.brands.push(brand);
    if (prefillReqId) {
      const req = (state.installRequests || []).find((r) => r.id === prefillReqId);
      if (req) { req.status = 'Terpasang & Aktif'; req.installedUnitId = unitId; }
    }
    pushNotification(client.ownerUsername, `Unit AC Baru Aktif: ${unitId}`, `${roomName} (${bld.name} ${floor}) — ${brand} ${cap} aktif di Edge Gateway ${bld.gatewayId}.`, 'success', 'units');
    addAuditLog(acc ? acc.username : 'admin_eka', acc ? acc.role : 'admin', client.city, `Menambahkan unit AC baru ${unitId} (${roomName}) di ${client.name} - ${bld.name}.`);
    saveState(); closeModal(); renderDashboard();
    showToast(`Unit AC ${unitId} (${roomName}) berhasil ditambahkan & aktif!`, 'success');
  } else {
    const liftId = document.getElementById('ent-lift-id').value.trim().toUpperCase();
    const liftName = document.getElementById('ent-lift-name').value.trim();
    if (!liftName) { showToast('Nama unit Lift baru wajib diisi.', 'warning'); return; }
    const liftBrand = document.getElementById('ent-lift-brand').value;
    const liftType = document.getElementById('ent-lift-type').value;
    const capacityKg = parseInt(document.getElementById('ent-lift-cap').value, 10) || 1350;
    const floorsCount = parseInt(document.getElementById('ent-lift-floors').value, 10) || 8;
    const suketNumber = document.getElementById('ent-lift-suket').value.trim() || `566/${2700 + state.elevators.length}/PJK3-JTM/2026`;
    const dateOffset = (days) => new Date(Date.now() + days * 86400000).toISOString().slice(0, 10);

    state.elevators.unshift({
      id: liftId, name: liftName, liftType, floorsCount,
      clientId: client.id, clientName: client.name, clientUsername: client.ownerUsername,
      city: client.city, buildingId: bld.id, buildingName: bld.name,
      brand: liftBrand, capacityKg, iotStatus: 'Normal', currentFloor: 'GF',
      tripCount: 120, motorHours: 14, ardStatus: 'Siap (Baterai 100%)',
      suketNumber, lastInspectionDate: dateOffset(0), expiryDate: dateOffset(365),
      k3Status: 'Layak K3', riksaRequestStatus: 'Tidak Perlu', riksaRequestedAt: null, lastChecklist: null
    });
    if (!client.brands.includes(liftBrand)) client.brands.push(liftBrand);
    if (prefillReqId) {
      const req = (state.installRequests || []).find((r) => r.id === prefillReqId);
      if (req) { req.status = 'Terpasang & Aktif'; req.installedUnitId = liftId; }
    }
    pushNotification(client.ownerUsername, `Unit Lift Baru Aktif: ${liftId}`, `${liftName} (${liftBrand}, ${floorsCount} Lantai, Suket ${suketNumber}) aktif di monitoring Lift & K3.`, 'success', 'elevators');
    pushNotification('pjk3_jatim', `Registrasi Lift Baru (${liftId}) & Suket Awal`, `${client.name} (${client.city}) mengaktifkan ${liftName} (${liftBrand}) dengan Suket ${suketNumber} (Layak K3 - 365 hari).`, 'info', 'compliance');
    addAuditLog(acc ? acc.username : 'admin_eka', acc ? acc.role : 'admin', client.city, `Menambahkan unit Lift baru ${liftId} (${liftName}) dengan Suket K3 ${suketNumber}.`);
    saveState(); closeModal(); renderDashboard();
    showToast(`Lift ${liftId} (${liftName}) berhasil ditambahkan & tersinkron ke PJK3 Jatim!`, 'success');
  }
}

function submitClientInstallRequest(e) {
  e.preventDefault();
  const acc = getCurrentAccount();
  const client = getClientRecordForAccount(acc);
  if (!client) return;
  const assetType = document.getElementById('req-ent-type').value;
  const buildingId = document.getElementById('req-ent-building').value;
  const bld = client.buildings.find((b) => b.id === buildingId) || client.buildings[0];
  const floor = document.getElementById('req-ent-floor').value.trim();
  const roomName = document.getElementById('req-ent-name').value.trim();
  const brand = document.getElementById('req-ent-brand').value;
  const capacity = document.getElementById('req-ent-cap').value;
  const notes = document.getElementById('req-ent-notes').value.trim();

  if (!Array.isArray(state.installRequests)) state.installRequests = [];
  const reqId = `REQ-${assetType.toUpperCase()}-${String(state.installRequests.length + 1).padStart(3, '0')}`;
  state.installRequests.unshift({
    id: reqId, assetType, clientId: client.id, clientName: client.name, clientUsername: acc.username,
    city: client.city, buildingId: bld.id, buildingName: bld.name,
    floor, roomName, brand, capacity, targetTemp: 21.0, zoneType: 'officeOpd',
    liftType: 'Passenger Lift', floorsCount: parseInt(floor, 10) || 8, notes,
    status: 'Menunggu Pemasangan', createdAt: new Date().toISOString(), installedUnitId: null
  });

  pushNotification('admin_eka', `Permohonan Unit ${assetType} Baru (${reqId})`, `${client.name} mengajukan instalasi ${assetType} ${brand} (${capacity}) di ${bld.name} (${roomName}).`, 'info', 'clients');
  addAuditLog(acc.username, 'client', client.city, `Mengajukan tiket pengadaan unit ${assetType} baru ${reqId} (${roomName}).`);
  saveState(); closeModal(); renderDashboard();
  showToast(`Tiket pengadaan ${reqId} terkirim ke Admin Eka!`, 'success');
}

  if (acc) {
    const defaultTabs = { superadmin: 'overview', admin: 'executive', client: 'overview', technician: 'workorders', pjk3: 'compliance' };
    currentTab = defaultTabs[acc.role] || 'overview';
    enterDashboard();
  } else {
    renderLoginView();
  }
});
